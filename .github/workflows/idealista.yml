name: agencias-bot

on:
  schedule:
    # Cada hora (UTC). El script actúa solo en CHECK_HOURS (9/11/15/18 hora España).
    - cron: "0 * * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: agencias-bot
  cancel-in-progress: false

permissions:
  contents: write   # para guardar agencias_state.json de vuelta en el repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Chequear agencias
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_MODEL: claude-haiku-4-5
          MAX_PRICE: "1500"
          HOUSING_ONLY: "true"
          CHECK_HOURS: "9,11,15,18"
          TIMEZONE: Europe/Madrid
        run: python check_agencias.py

      - name: Guardar estado
        run: |
          if [ -n "$(git status --porcelain agencias_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add agencias_state.json
            git commit -m "update agencias state [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "Sin cambios en el estado."
          fi
