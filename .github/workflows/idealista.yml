name: idealista-bot

on:
  schedule:
    # Cada 30 min (UTC). El script filtra el horario 6am-2am de España por su cuenta.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

# Evita que dos ejecuciones se pisen al guardar el estado.
concurrency:
  group: idealista-bot
  cancel-in-progress: false

# Necesario para que el workflow pueda guardar state.json de vuelta en el repo.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Chequear Idealista
        env:
          SEARCH_URL: ${{ secrets.SEARCH_URL }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRAFT_MODE: template
          ACTIVE_START_HOUR: "6"
          ACTIVE_END_HOUR: "2"
          TIMEZONE: Europe/Madrid
        run: python run_once.py

      - name: Guardar estado (anuncios ya vistos)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update seen state [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "Sin cambios en el estado."
          fi
